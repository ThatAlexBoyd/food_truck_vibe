        body {

        .card {
            background-color: white;
            border-radius: 0.75rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.2s ease-in-out;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            opacity: 1;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #4f46e5;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #4338ca;
        }
        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #d1d5db;
        }
         .btn-green {
            background-color: #10b981;
            color: white;
        }
        .btn-green:hover:not(:disabled) {
            background-color: #059669;
        }
        .btn-yellow {
            background-color: #f59e0b;
            color: white;
        }
        .btn-yellow:hover:not(:disabled) {
            background-color: #d97706;
        }
        .btn-light-blue {
            background-color: #dbeafe; /* bg-blue-200 */
            color: #1e40af; /* text-blue-800 */
        }
        .btn-light-blue:hover:not(:disabled) {
            background-color: #bfdbfe; /* bg-blue-300 */
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            max-width: 90%;
            width: 500px;
        }
        /* Styles for the map */
        .map-pin {
            transition: all 0.2s ease-in-out;
        }
        .map-pin:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2));
        }
        .map-container {
            position: relative;
            width: 100%;
            height: 25rem;
            background-color: #dbeafe;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 2px solid #d1d5db;
        }
        .map-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .location-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s ease-in-out;
        }
        .location-marker.selected {
            background-color: rgba(255, 255, 255, 0.7);
        }
        .current-location-tile {
            background-color: rgba(191, 219, 254, 0.9); /* bg-blue-200 */
        }
        
        .flash {
            animation: flash-animation 0.3s ease-out;
        }
        @keyframes flash-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        #progress-bar {
            transition: width 0.2s ease-out;
        }
        /* Styles for Class Labels */

                    footerHTML = `<div class="mt-6 flex justify-end gap-3"><button id="modal-leave-btn" class="btn btn-secondary">Leave</button><button class="btn btn-green" onclick="buyRecipe('${locationName}', '${recipeName}', 0)" ${!challengeMet ? 'disabled' : ''}>Claim Recipe!</button></div>`;

                    challengeHTML = `<div class="p-4 border rounded-lg ${challengeMet ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'}"><p class="font-semibold text-lg ${challengeMet ? 'text-green-800' : 'text-yellow-800'}">Challenge: Master a Recipe</p><p class="mt-1 text-sm ${challengeMet ? 'text-green-700' : 'text-yellow-700'}">${condition.description}</p></div>`;

        function renderStore(locationName) {
             const location = LOCATIONS.find(l => l.name === locationName);
             let ingredientsHTML = '';
             
             Object.keys(INGREDIENT_DATA).forEach(itemName => {
                const details = INGREDIENT_DATA[itemName];
                const isLocallyAvailable = location.available_ingredients.includes(itemName);
                let currentPrice = details.price;
                let priceModificationHTML = '';
                
                if (player.activeEvent) {
                    if (player.activeEvent.type === 'cost_increase' || player.activeEvent.type === 'cost_decrease') {
                        currentPrice *= (1 + player.activeEvent.value);
                        const changeClass = player.activeEvent.isPositive ? 'text-green-600' : 'text-red-600';
                        const sign = player.activeEvent.value > 0 ? '+' : '';
                        priceModificationHTML = `<span class="text-xs font-bold ${changeClass}">(${sign}${(player.activeEvent.value * 100).toFixed(0)}%)</span>`;
                    } else if (player.activeEvent.type === 'bogo') {
                        priceModificationHTML = `<span class="text-xs font-bold text-blue-600">BOGO!</span>`;
                    }
                }
                
                const isDisabled = !isLocallyAvailable || player.money < currentPrice;
                const priceDetailsHTML = isLocallyAvailable ? `<div class="flex items-center gap-2"><p class="font-semibold text-green-600">$${currentPrice.toFixed(2)}</p>${priceModificationHTML}</div><p class="text-sm text-gray-500">+${details.servings} servings</p>` : `<p class="font-semibold text-gray-400">$${details.price.toFixed(2)}</p><p class="text-sm text-red-600 font-medium">Not sold here</p>`;
                
                ingredientsHTML += `<button onclick="buyIngredient('${locationName}', '${itemName}')" ${isDisabled ? 'disabled' : ''} class="w-full text-left p-4 border-b border-gray-200 last:border-b-0 flex justify-between items-center transition-colors hover:bg-gray-50 disabled:bg-gray-50 disabled:cursor-not-allowed">

                                     </button>`;
             });
             mainPanel.innerHTML = `<div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold">Store at ${location.name}</h2><button class="btn btn-secondary" onclick="renderAtLocation('${locationName}')">Back</button></div><div>${ingredientsHTML}</div>`;

        function showModal(title, content, buttonText, callback) {
            modal.classList.remove('hidden');
            modalContent.style.maxWidth = "500px";
            modalContent.innerHTML = `<div class="text-center"><h2 class="text-2xl font-bold mb-4">${title}</h2><div class="text-left space-y-2 mb-6">${content}</div><button id="modal-btn" class="btn btn-primary">${buttonText}</button></div>`;
            document.getElementById('modal-btn').onclick = () => { modal.classList.add('hidden'); if(callback) callback(); };
        }

        function getTravelDays(fromLocationName, toLocationName) {
            if (fromLocationName === toLocationName) return 0;
            const fromLoc = LOCATIONS.find(l => l.name === fromLocationName); const toLoc = LOCATIONS.find(l => l.name === toLocationName);
            const fromCoords = { x: parseInt(fromLoc.coords.split(';')[1].split(':')[1]), y: parseInt(fromLoc.coords.split(';')[0].split(':')[1]) };
            const toCoords = { x: parseInt(toLoc.coords.split(';')[1].split(':')[1]), y: parseInt(toLoc.coords.split(';')[0].split(':')[1]) };
            const distance = Math.sqrt(Math.pow(toCoords.x - fromCoords.x, 2) + Math.pow(toCoords.y - fromCoords.y, 2)); return Math.ceil(distance / 20);
        }

        function goToLocationMenu() { renderLocations(); }
        
        function chooseLocation(locationName) {
            if (player.currentLocation === locationName) { renderAtLocation(locationName); return; }
            const travelDays = getTravelDays(player.currentLocation, locationName);
            player.day += travelDays;
            player.currentLocation = locationName; isNewDay = true;
            updateAllUI(); renderAtLocation(locationName);
        }
        
        function buyIngredient(locationName, itemName) { 
            const details = INGREDIENT_DATA[itemName]; 
            let currentPrice = details.price; 
            let isBogo = false;

            if (player.activeEvent) {
                if (player.activeEvent.type === 'cost_increase' || player.activeEvent.type === 'cost_decrease') { 
                    currentPrice *= (1 + player.activeEvent.value); 
                } else if (player.activeEvent.type === 'bogo') { 
                    isBogo = true; 
                }
            }
            
            const servingsToAdd = isBogo ? details.servings * 2 : details.servings;
            if (player.truck.currentCapacity + servingsToAdd > player.truck.capacity) {
                showModal("Inventory Full", `You don't have enough space in your truck. You need ${servingsToAdd} space, but only have ${player.truck.capacity - player.truck.currentCapacity} available.`, "Okay", null);
                return;
            }

            if (player.money >= currentPrice) { 
                player.money -= currentPrice; 
                player.inventory[itemName] += servingsToAdd;
                updateTruckCapacity();
                updateAllUI(); 
                renderStore(locationName); 
            } 
        }
        
        function buyRecipe(locationName, recipeName, cost) {
            if (player.money >= cost) {
                player.money -= cost; 
                player.cookbook[recipeName] = { level: 1, xp: 0, currentMod: null };
                updateAllUI();

        function runSalesSimulation(locationName, competitionDetails = null) {
            const location = LOCATIONS.find(l => l.name === locationName);
            const maxPossibleCustomers = location.max_customers * 0.25;
            let minCustomers = 0; let maxCustomers = maxPossibleCustomers;
        
            if (player.activeEvent && !competitionDetails) {
                if (player.activeEvent.type === 'customer_boost') { minCustomers = Math.ceil((maxPossibleCustomers / 3) * 2); } 
                else if (player.activeEvent.type === 'customer_slump') { maxCustomers = Math.floor(maxPossibleCustomers / 3); } 
            }
            if (competitionDetails) { minCustomers = maxPossibleCustomers * 0.5; maxCustomers = maxPossibleCustomers; }
            
            let actual_customers = Math.floor(minCustomers + Math.random() * (maxCustomers - minCustomers + 1));
            
            if (actual_customers <= 0) {
                showModal('A Quiet Day...', '<p>No customers showed up today. Better luck tomorrow!</p>', 'Continue', () => { player.day++; isNewDay = true; updateAllUI(); renderAtLocation(locationName); });
                return;
            }
        
            const saleEvents = [];
            const tempInventory = JSON.parse(JSON.stringify(player.inventory));
            const preferredClass = location.preferred_class;
            const localFavorites = location.preferences;
        
            for (let i = 0; i < actual_customers; i++) {
                let chosen_food = null;

                if (competitionDetails) { // Competition logic overrides normal preferences
                    chosen_food = competitionDetails.recipe;
                } else {
                    const menuItemsOfPreferredClass = player.menu.filter(item => SANDWICH_DATA[item].class === preferredClass);
                    
                    if (menuItemsOfPreferredClass.length > 0 && Math.random() < 0.75) {
                        const classFavoritesOnMenu = menuItemsOfPreferredClass.filter(item => localFavorites.includes(item));
                        if (classFavoritesOnMenu.length > 0 && Math.random() < 0.80) {
                            chosen_food = getRandomElement(classFavoritesOnMenu);
                        } else {
                            chosen_food = getRandomElement(menuItemsOfPreferredClass);
                        }
                    } else {
                        const favoritesOnMenu = player.menu.filter(item => localFavorites.includes(item));
                        if (favoritesOnMenu.length > 0 && Math.random() < 0.50) {
                            chosen_food = getRandomElement(favoritesOnMenu);
                        } else {
                            chosen_food = getRandomElement(player.menu);
                        }
                    }
                }
                
                const sandwich_details = SANDWICH_DATA[chosen_food];
                const mastery_details = player.cookbook[chosen_food];
                const ingredientsToConsume = { ...sandwich_details.recipe };
                
                let can_make = true;
                for (const [ingredient, required_qty] of Object.entries(ingredientsToConsume)) {
                    if (tempInventory[ingredient] < required_qty) { can_make = false; break; }
                }
                
                if (can_make) {
                    for (const [ingredient, required_qty] of Object.entries(ingredientsToConsume)) { tempInventory[ingredient] -= required_qty; }
        
                    const sale = { itemName: chosen_food, price: sandwich_details.selling_prices[mastery_details.level - 1], repGain: 0, xpGain: 0, levelUpInfo: null, ingredientsUsed: ingredientsToConsume };
                    
                    const isPreferredClass = SANDWICH_DATA[chosen_food].class === preferredClass;
                    const isLocalFavorite = localFavorites.includes(chosen_food);
                    
                    // XP Gain Logic
                    if (mastery_details.level < 10) {
                        let xpChance = 0.30;
                        if(isPreferredClass) xpChance = 0.60;
                        if(isLocalFavorite) xpChance = 0.75;
                        if (Math.random() < xpChance) { sale.xpGain = 1; }
                    }

                    // Reputation Gain Logic
                    if (player.reputation[locationName] < location.max_rep) {
                        let repAmount = 0;
                        if (isLocalFavorite) repAmount = 2;
                        else if (isPreferredClass) repAmount = 1;

                        if (repAmount > 0) {
                            let repChance = isLocalFavorite ? 0.85 : 0.60;
                            if (mastery_details.level >= 10) repChance = Math.max(repChance, 0.85); // Mastered items are reliable for rep
                            if (Math.random() < repChance) {
                                sale.repGain = repAmount;
                            }
                        }
                    }
                    
                    saleEvents.push(sale);
                }
            }
            showSalesVisualizer(saleEvents, locationName);
        }

        function generateXpCurves() {
            for (const sandwichName in SANDWICH_DATA) {
                const sandwich = SANDWICH_DATA[sandwichName];
                const baseXP = sandwich.xp_to_next_levels[0]; // Use the first value as the base for scaling
                const newXpCurve = [];

                for (let level = 1; level < 10; level++) {
                    const progress = (level - 1) / 8.0;
                    const sineFactor = 0.5 * (1 - Math.cos(progress * Math.PI)); 
                    const maxIncrement = baseXP * 4;
                    const xpNeeded = baseXP + maxIncrement * sineFactor;
                    newXpCurve.push(Math.round(xpNeeded / 5) * 5);
                }
                sandwich.xp_to_next_levels = newXpCurve;
            }
        }

                                    <button onclick="closeCookbookModal()" class="btn btn-secondary">Close</button>
                                </div>
                                <div id="cookbook-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-2">`;

            for (const recipeName of Object.keys(player.cookbook).sort()) {
                const mastery = player.cookbook[recipeName];
                const sandwichDetails = SANDWICH_DATA[recipeName];
                const isOnMenu = player.menu.includes(recipeName);

                // Ingredients
                let ingredientsHTML = '';
                for (const [ing, qty] of Object.entries(sandwichDetails.recipe)) {
                    if (qty > 0) ingredientsHTML += `<span>${INGREDIENT_DATA[ing].emoji}${qty > 1 ? `<span class="text-xs font-semibold">${qty}</span>` : ''}</span> `;
                }

                // Mods Dropdown
                let modOptions = `<option value="">None</option>`;
                MODS.forEach(mod => {
                    const isSelected = mastery.currentMod === mod ? 'selected' : '';
                    modOptions += `<option value="${mod}" ${isSelected}>${mod}</option>`;
                });

                // Checkbox
                const isMenuFull = player.menu.length >= player.maxMenu && !isOnMenu;
                
                cookbookHTML += `
                    <div class="p-4 border rounded-lg flex flex-col md:flex-row md:items-center gap-4">
                        <div class="flex-grow">
                            <div class="flex items-center gap-2">
                                <h3 id="mod-name-${recipeName.replace(/\s+/g, '-')}" class="text-xl font-bold transition-colors">${recipeName}</h3>
                                <span class="text-sm font-semibold text-gray-600">(Lvl ${mastery.level})</span>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">${ingredientsHTML.trim()}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <select onchange="applyMod('${recipeName}', this.value)" class="p-2 border rounded-md bg-gray-50">
                                ${modOptions}
                            </select>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" onchange="toggleMenuItemFromModal('${recipeName}', this)" ${isOnMenu ? 'checked' : ''} ${isMenuFull ? 'disabled' : ''} class="h-5 w-5 rounded text-indigo-600 focus:ring-indigo-500">
                                <span class="font-semibold">On Menu</span>
                            </label>
                        </div>
                    </div>`;
            }
            cookbookHTML += `</div>`;
            modalContent.innerHTML = cookbookHTML;

            // Apply initial colors
            for (const recipeName of Object.keys(player.cookbook)) {
                applyMod(recipeName, player.cookbook[recipeName].currentMod, false);
            }
        }

        function closeCookbookModal() {
            modal.classList.add('hidden');
            updateAllUI(); // Refreshes the menu panel
            if (document.getElementById('main-panel-content')) {
                renderAtLocation(player.currentLocation); // Refreshes the main panel and sell button state
            }
        }

        function applyMod(recipeName, mod) {
            player.cookbook[recipeName].currentMod = mod || null;
            const nameEl = document.getElementById(`mod-name-${recipeName.replace(/\s+/g, '-')}`);
            if (!nameEl) return;
            
            nameEl.classList.remove('text-green-600', 'text-red-600', 'text-gray-800');
            
            let modValue = 0;
            if (mod && SANDWICH_MOD_DATA[recipeName]) {
                 modValue = SANDWICH_MOD_DATA[recipeName][mod] ?? 0;
            }

            if (modValue === 1) {
                nameEl.classList.add('text-green-600');
            } else if (modValue === -1) {
                nameEl.classList.add('text-red-600');
            } else {
                nameEl.classList.add('text-gray-800');
            }
        }

        function toggleMenuItemFromModal(recipeName, checkbox) {
            const index = player.menu.indexOf(recipeName);
            if (index > -1) {
                player.menu.splice(index, 1);
            } else {
                if (player.menu.length >= player.maxMenu) {
                    checkbox.checked = false; // Revert checkbox if menu is full
                    return; 
                }
                player.menu.push(recipeName);
            }
            updateMenuPanel();

            // Update disabled state of all checkboxes in the modal
            const isMenuNowFull = player.menu.length >= player.maxMenu;
            const allCheckboxes = modalContent.querySelectorAll('input[type="checkbox"]');
            allCheckboxes.forEach(cb => {
                if (!cb.checked) {
                    cb.disabled = isMenuNowFull;
                }
            });
        }
        
        generateXpCurves();
        initGame();

    </script>
</body>
</html>
